<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}

.data-table thead th.col-importe{background:var(--navy-mid)}
.colf-wrap{position:relative;display:inline-block;margin-left:6px}

.colf-list{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}

.colf-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sort-arrow{margin-left:3px;opacity:.6;font-size:.65rem}
.col-cliente{text-align:left;min-width:220px}.col-txt{text-align:left;min-width:160px}.col-num{text-align:right;min-width:130px;white-space:nowrap}
tbody .col-importe{background:rgba(224,238,255,.4)}
.data-table tbody td{padding:7px 11px;border-bottom:1px solid var(--gray-100);font-family:var(--font-mono);font-size:.77rem;vertical-align:top}
.td-cliente{font-family:var(--font-sans)!important;font-size:.79rem!important;color:var(--navy);font-weight:600}
.td-obs{font-family:var(--font-sans)!important;font-size:.74rem!important;color:var(--gray-600);max-width:280px;white-space:normal}
.td-desc{font-family:var(--font-sans)!important;font-size:.76rem!important;color:var(--gray-800);max-width:220px;white-space:normal}
.row-alt{background:var(--gray-50)}.data-table tbody tr:hover{background:var(--sky)!important}
.totals-row{background:var(--navy)!important;position:sticky;bottom:0}
.totals-row td{color:var(--white)!important;font-family:var(--font-mono)!important;font-weight:700!important;font-size:.77rem!important;padding:9px 11px!important;border-bottom:none!important;white-space:nowrap}
.empty-table{text-align:center;padding:48px;color:var(--gray-400);font-size:.9rem;background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg)}
.legend-bar{display:flex;gap:14px;margin-top:8px;padding:7px 12px;background:var(--gray-100);border-radius:var(--radius);flex-wrap:wrap}
.leg{font-size:.7rem;color:var(--gray-600)}
.pill-tipo{font-size:.63rem;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
.pill-pedido{background:var(--sky);color:var(--blue)}.pill-remito{background:var(--purple-light);color:var(--purple)}.pill-otro{background:var(--amber-light);color:var(--amber-dark)}
.app-footer{text-align:center;padding:13px;font-size:.7rem;color:var(--gray-400);border-top:1px solid var(--gray-200);background:var(--white)}
@media print{.app-header,.header-actions,.toolbar,.legend-bar,.app-footer,.btn,.search-wrap{display:none!important}.table-wrap{box-shadow:none;border:1px solid #ccc}}

<body><div id="root"></div>
<script>
const{useState,useMemo,useRef,useEffect}=React;
const h=React.createElement;

// ═══ HELPERS (reutilizados del tablero principal) ═══
function parseDate(v){
  if(!v)return null;if(v instanceof Date)return v;
  if(typeof v==='number'){const d=new Date((v-25569)*86400*1000);return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());}
  const s=v.toString().trim();
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);
  const d=new Date(s);return isNaN(d)?null:d;
}
function fmtDate(v){const d=parseDate(v);if(!d)return '—';return d.toLocaleDateString('es-AR');}
function num(v){
  if(v===null||v===undefined||v==='')return 0;
  if(typeof v==='number')return isFinite(v)?v:0;
  let s=v.toString().trim().replace(/\s| /g,'');
  if(!s)return 0;
  const hasDot=s.includes('.'),hasComma=s.includes(',');
  if(hasDot&&hasComma){s=s.replace(/\./g,'').replace(',','.');}
  else if(hasComma){s=s.replace(',','.');}
  const n=parseFloat(s);return isNaN(n)?0:n;
}
function findCol(hdr,cands){for(const c of cands){const re=new RegExp(c,'i');const i=hdr.findIndex(x=>re.test((x||'').toString().trim()));if(i>=0)return i;}return -1;}
function sheetToRows(wb){const ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{header:1,defval:null});}
function fmtUSD(v){if(Math.abs(v)<0.005)return '—';return '$'+Math.abs(v).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});}

const DEDUP_MAP={
  'Agrotecnología y Servicios S.A.':'AGROTECNOLOGIA Y SERVICIOS SA',
  'BAILLERES COMERCIAL S.A':'BAILLERES COMERCIAL SA','DS Hnos. SRL':'DS HNOS SRL',
  'ESTANCIAS SAN AGUSTIN SOCIEDAD EN COMANDITA POR AC':'ESTANCIAS SAN AGUSTIN SCA',
  'GANADERA LOS MOLLES S.A':'GANADERA LOS MOLLES S.A.','Gesagro S.A.':'GESAGRO SA','GESAGRO SA':'GESAGRO SA',
  'HESAR HNOS S.A':'HESAR HNOS S.A.','Maiocco Cereales S.A.':'MAIOCCO CEREALES SA',
  'M.C.M SOCIEDAD DE RESPONSABILIDAD LIMITADA':'M.C.M SRL','Plantaflor S.A.':'PLANTAFLOR SA',
  'TOSQUITA CEREALES SOCIEDAD ANONIMA':'TOSQUITA CEREALES SA',
  'ZANOY AGRO & SERVICIOS SOCIEDAD ANONIMA':'ZANOY AGRO & SERVICIOS SA',
  'CEREALISTA MOLDES S A':'CEREALISTA MOLDES SA','ALDO RUFFINO AGROPECUARIA S. A.':'ALDO RUFFINO AGROPECUARIA SA',
  'LOGRANDO AMIGOS S R L':'LOGRANDO AMIGOS SRL',
  'AGROTECNICA COMERCIAL S.R.L. (AGROTECNICA COMERCIA':'AGROTECNICA COMERCIAL S.R.L.',
  'TERRA VERDE AGRO INSUMOS SA SA':'TERRA VERDE AGRO INSUMOS SA','Terra Verde Agro Insumos SA':'TERRA VERDE AGRO INSUMOS SA',
};
function canonical(n){const s=(n||'').toString().trim();return DEDUP_MAP[s]||s;}

// Códigos de comprobante conocidos. Cualquier código nuevo que empiece con PED/REM
// también se clasifica por prefijo; lo que no matchee ninguno de los dos cae en "Otros".
const PEDIDOS_CODES=['PED','PEDA','PDD','PEDTER','PEDCYO'];
const REMITOS_CODES=['REM','REMM','REMTER','REMCYO','REMMTE'];
function tipoComprobante(codigo){
  const c=(codigo||'').toString().trim().toUpperCase();
  if(PEDIDOS_CODES.includes(c))return 'pedido';
  if(REMITOS_CODES.includes(c))return 'remito';
  if(/^PED/.test(c))return 'pedido';
  if(/^REM/.test(c))return 'remito';
  return 'otro';
}

// ═══ PARSEO DE "NEGOCIOS PTES DE FACTURAR" ═══
function parseNegocios(wb){
  const rows=sheetToRows(wb);if(!rows.length)return[];
  const hdr=rows[0].map(x=>(x||'').toString());
  const cC=findCol(hdr,['Nombre del Productor','Productor','Cliente']);
  const cCod=findCol(hdr,['Código de Comprobante','Codigo.*Comp']);
  const cNro=findCol(hdr,['Numero de Comprobante','Numero.*Comp','Numero']);
  const cFecha=findCol(hdr,['^Fecha$']);
  const cArt=findCol(hdr,['Artículo','Articulo']);
  const cDesc=findCol(hdr,['^Descripción$','^Descripcion$']);
  const cI=findCol(hdr,['IMPORTE','Importe','Monto']);
  const cR=findCol(hdr,['DESCIPCION_RUBRO','DESCRIPCION_RUBRO','Rubro']);
  const cObs=findCol(hdr,['Observaciones']);
  const cFvto=findCol(hdr,['FECHA_VENCIMIENTO_ORIGEN','Vencimiento.*Origen']);
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r||!r[cC])continue;
    const rubro=(cR>=0?r[cR]:'')||'';
    // "4 - Fertilizante" → IVA 10,5% | "1 - Agroquimico", "99 - Otros" y demás → IVA 21%
    const iva=/fert/i.test(rubro)?0.105:0.21;
    const importeConIva=num(cI>=0?r[cI]:0)*(1+iva);
    const codigo=(cCod>=0?r[cCod]:'')||'';
    const numero=(cNro>=0?r[cNro]:'')||'';
    out.push({
      cliente:canonical(r[cC]),
      codigo, numero,
      comprobante:codigo&&numero?codigo+' '+numero:(codigo||numero||'—'),
      tipo:tipoComprobante(codigo),
      fecha:cFecha>=0?r[cFecha]:null,
      articulo:(cArt>=0?r[cArt]:'')||'',
      descripcion:(cDesc>=0?r[cDesc]:'')||'',
      rubro,
      importe:importeConIva,
      vencimientoOrigen:cFvto>=0?r[cFvto]:null,
      observaciones:(cObs>=0?r[cObs]:'')||'',
    });
  }
  return out;
}

// ═══ COMPONENTES ═══
function DropZone({label,hint,file,onFile,icon,disabled}){
  const[drag,setDrag]=useState(false);const ref=useRef();
  const handle=f=>{if(disabled)return;if(f&&(f.name.endsWith('.xlsx')||f.name.endsWith('.xls')))onFile(f);};
  return h('div',{className:`dropzone${drag?' drag':''}${file?' has-file':''}${disabled?' disabled':''}`,
    onClick:()=>!disabled&&ref.current.click(),
    onDragOver:e=>{e.preventDefault();if(!disabled)setDrag(true)},
    onDragLeave:()=>setDrag(false),
    onDrop:e=>{e.preventDefault();setDrag(false);handle(e.dataTransfer.files[0])},
  },
    h('input',{ref,type:'file',accept:'.xlsx,.xls',style:{display:'none'},disabled,onChange:e=>handle(e.target.files[0])}),
    h('div',{className:'dz-icon'},icon),h('div',{className:'dz-label'},label),
    disabled?h('div',{className:'dz-soon'},'Próximamente'):
      (file?h('div',{className:'dz-file'},'✓ '+file.name):h('div',{className:'dz-hint'},hint))
  );
}
function SummaryCard({label,value,sub,accent}){
  return h('div',{className:'summary-card'+(accent?' '+accent:'')},
    h('div',{className:'sc-label'},label),h('div',{className:'sc-value'},fmtUSD(value)),
    sub&&h('div',{className:'sc-sub'},sub));
}

function useSort(rows,defaultKey,defaultDir){
  const[key,setKey]=useState(defaultKey);const[dir,setDir]=useState(defaultDir||1);
  const onSort=k=>{if(k===key)setDir(d=>-d);else{setKey(k);setDir(1);}};
  const sorted=useMemo(()=>{
    const arr=[...rows];
    arr.sort((a,b)=>{
      let av=a[key],bv=b[key];
      if(key==='fecha'||key==='vencimientoOrigen'){av=parseDate(av)?.getTime()||0;bv=parseDate(bv)?.getTime()||0;}
      else if(typeof av==='string'){av=av.toLowerCase();bv=(bv||'').toLowerCase();}
      if(av<bv)return -1*dir;if(av>bv)return 1*dir;return 0;
    });
    return arr;
  },[rows,key,dir]);
  return{sorted,key,dir,onSort};
}

// Filtro estilo Excel: funnel con lista de checkboxes sobre los valores únicos de la columna.
function ColumnFilter({options,selected,onChange}){
  const[open,setOpen]=useState(false);
  const[q,setQ]=useState('');
  const ref=useRef();
  useEffect(()=>{
    if(!open)return;
    const onDoc=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',onDoc);
    return()=>document.removeEventListener('mousedown',onDoc);
  },[open]);
  const active=selected!==null;
  const visibleOptions=useMemo(()=>{
    const qq=q.trim().toLowerCase();
    return qq?options.filter(o=>o.toLowerCase().includes(qq)):options;
  },[options,q]);
  const isChecked=v=>!active||selected.has(v);
  const toggle=v=>{
    const base=active?new Set(selected):new Set(options);
    if(base.has(v))base.delete(v);else base.add(v);
    onChange(base.size===options.length?null:base);
  };
  return h('span',{className:'colf-wrap',ref,onClick:e=>e.stopPropagation()},
    h('button',{className:'colf-btn'+(active?' active':''),onClick:()=>setOpen(o=>!o),title:'Filtrar'},'▾'),
    open&&h('div',{className:'colf-panel'},
      h('input',{className:'colf-search',type:'text',placeholder:'Buscar…',value:q,onChange:e=>setQ(e.target.value),onClick:e=>e.stopPropagation()}),
      h('div',{className:'colf-actions'},
        h('button',{onClick:()=>onChange(null)},'Todos'),
        h('button',{onClick:()=>onChange(new Set())},'Ninguno')),
      h('div',{className:'colf-list'},
        visibleOptions.map(o=>h('label',{key:o,className:'colf-item'},
          h('input',{type:'checkbox',checked:isChecked(o),onChange:()=>toggle(o)}),
          h('span',{},o||'(vacío)')))
      )
    )
  );
}

function NegociosTable({rows,tipo}){
  const[search,setSearch]=useState('');
  const[filtroCliente,setFiltroCliente]=useState(null);
  const[filtroCodigo,setFiltroCodigo]=useState(null);

  const uniqueClientes=useMemo(()=>[...new Set(rows.map(r=>r.cliente))].sort((a,b)=>a.localeCompare(b)),[rows]);
  const uniqueCodigos=useMemo(()=>[...new Set(rows.map(r=>r.codigo))].sort((a,b)=>a.localeCompare(b)),[rows]);

  // Si cambia de pestaña (pedidos/remitos), los filtros de columna se resetean para no arrastrar selecciones que no aplican.
  useEffect(()=>{setFiltroCliente(null);setFiltroCodigo(null);setSearch('');},[tipo]);

  const filtered=useMemo(()=>{
    const q=search.trim().toLowerCase();
    return rows.filter(r=>{
      if(filtroCliente!==null&&!filtroCliente.has(r.cliente))return false;
      if(filtroCodigo!==null&&!filtroCodigo.has(r.codigo))return false;
      if(!q)return true;
      return r.cliente.toLowerCase().includes(q)||r.codigo.toLowerCase().includes(q)||r.numero.toString().toLowerCase().includes(q)||
        (r.articulo||'').toLowerCase().includes(q)||(r.descripcion||'').toLowerCase().includes(q)||(r.observaciones||'').toLowerCase().includes(q);
    });
  },[rows,search,filtroCliente,filtroCodigo]);
  const{sorted,key,dir,onSort}=useSort(filtered,'cliente',1);
  const total=useMemo(()=>filtered.reduce((s,r)=>s+r.importe,0),[filtered]);

  const cols=[
    {k:'cliente',label:'Cliente',cls:'col-cliente',filter:h(ColumnFilter,{options:uniqueClientes,selected:filtroCliente,onChange:setFiltroCliente})},
    {k:'codigo',label:'Código',cls:'col-txt',filter:h(ColumnFilter,{options:uniqueCodigos,selected:filtroCodigo,onChange:setFiltroCodigo})},
    {k:'numero',label:'Número',cls:'col-txt'},
    {k:'descripcion',label:'Artículo / Descripción',cls:'col-txt'},
    {k:'importe',label:'Importe + IVA (USD)',cls:'col-num col-importe'},
    {k:'fecha',label:'Fecha',cls:'col-num'},
    {k:'vencimientoOrigen',label:'Fecha Vto. Origen',cls:'col-num'},
    {k:'observaciones',label:'Observaciones',cls:'col-txt'},
  ];
  const activeFilterCount=(filtroCliente!==null?1:0)+(filtroCodigo!==null?1:0);

  return h(React.Fragment,{},
    h('div',{className:'toolbar'},
      h('div',{className:'toolbar-left'},
        h('span',{style:{fontSize:'.8rem',color:'var(--gray-600)'}},filtered.length+' de '+rows.length+' registros'),
        activeFilterCount>0&&h('button',{className:'filter-chip active',onClick:()=>{setFiltroCliente(null);setFiltroCodigo(null);}},
          activeFilterCount+' filtro'+(activeFilterCount>1?'s':'')+' activo'+(activeFilterCount>1?'s':'')+' ✕')
      ),
      h('div',{className:'toolbar-right'},
        h('div',{className:'search-wrap'},
          h('span',{className:'search-icon'},'🔍'),
          h('input',{type:'text',placeholder:'Buscar cliente, artículo, comprobante…',value:search,onChange:e=>setSearch(e.target.value),className:'search-input'}),
          search&&h('button',{className:'search-clear',onClick:()=>setSearch('')},'✕')))
    ),
    sorted.length===0?h('div',{className:'empty-table'},'No hay '+(tipo==='pedido'?'pedidos':tipo==='remito'?'remitos':'registros')+' que coincidan.'):
    h('div',{className:'table-wrap'},
      h('table',{className:'data-table'},
        h('thead',{},h('tr',{},
          cols.map(c=>h('th',{key:c.k,className:c.cls},
            h('span',{onClick:()=>onSort(c.k),style:{cursor:'pointer'}},c.label,key===c.k&&h('span',{className:'sort-arrow'},dir===1?'▲':'▼')),
            c.filter
          ))
        )),
        h('tbody',{},
          sorted.map((r,i)=>h('tr',{key:i,className:i%2?'row-alt':''},
            h('td',{className:'td-cliente'},r.cliente),
            h('td',{},r.codigo||'—'),
            h('td',{},r.numero||'—'),
            h('td',{className:'td-desc'},r.descripcion||r.articulo||'—'),
            h('td',{className:'col-num col-importe'},fmtUSD(r.importe)),
            h('td',{className:'col-num'},fmtDate(r.fecha)),
            h('td',{className:'col-num'},fmtDate(r.vencimientoOrigen)),
            h('td',{className:'td-obs'},r.observaciones||'—'),
          ))
        ),
        h('tfoot',{},h('tr',{className:'totals-row'},
          h('td',{},'TOTAL'),h('td',{},''),h('td',{},''),h('td',{},''),
          h('td',{className:'col-num'},fmtUSD(total)),
          h('td',{},''),h('td',{},''),h('td',{},'')
        ))
      )
    )
  );
}

function App(){
  const[files,setFiles]=useState({negocios:null,ctaCte:null,cheques:null,canjes:null});
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState('');
  const[rows,setRows]=useState(null);
  const[tab,setTab]=useState('pedidos');

  const readExcel=file=>new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=e=>{try{res(XLSX.read(e.target.result,{type:'array',cellDates:false}))}catch(err){rej(err)}};
    reader.onerror=()=>rej(new Error('No se pudo leer '+file.name));
    reader.readAsArrayBuffer(file);
  });

  const handleProcess=async()=>{
    setError('');setLoading(true);
    try{
      const wb=await readExcel(files.negocios);
      const parsed=parseNegocios(wb);
      if(!parsed.length)throw new Error('El Excel no tiene filas reconocibles. Revisá que sea el archivo "Negocios ptes de facturar".');
      setRows(parsed);
    }catch(e){setError(e.message||'Error al procesar el archivo');}
    finally{setLoading(false);}
  };

  const pedidos=useMemo(()=>rows?rows.filter(r=>r.tipo==='pedido'):[],[rows]);
  const remitos=useMemo(()=>rows?rows.filter(r=>r.tipo==='remito'):[],[rows]);
  const otros=useMemo(()=>rows?rows.filter(r=>r.tipo==='otro'):[],[rows]);

  const current=tab==='pedidos'?pedidos:tab==='remitos'?remitos:otros;

  return h('div',{className:'app'},
    h('header',{className:'app-header'},
      h('div',{className:'header-inner'},
        h('div',{className:'header-brand'},
          h('div',{className:'header-logo'},'📦'),
          h('div',{},
            h('div',{className:'header-title'},'Pedidos y Remitos'),
            h('div',{className:'header-sub'},'Negocios pendientes de facturar'))),
        rows&&h('div',{className:'header-actions'},
          h('button',{className:'btn btn-ghost',onClick:()=>{setRows(null);setFiles({negocios:null,ctaCte:null,cheques:null,canjes:null});}},'↺ Nuevo archivo'),
          h('button',{className:'btn btn-primary',onClick:()=>window.print()},'🖨 PDF'),
        )
      )
    ),
    h('main',{className:'app-main'},
      !rows&&h('section',{className:'upload-section'},
        h('div',{className:'section-header'},
          h('h2',{},'Cargá el Excel'),
          h('p',{},'Por ahora esta vista solo procesa "Negocios ptes de facturar". Los otros 3 archivos van a sumarse más adelante.')),
        h('div',{className:'dropzones-grid'},
          h(DropZone,{label:'Cuenta Corriente Clientes',hint:'Cta_cte_clientes.xlsx',file:files.ctaCte,onFile:()=>{},icon:'📋',disabled:true}),
          h(DropZone,{label:'Cheques en Cartera',hint:'Cheques_en_cartera.xlsx',file:files.cheques,onFile:()=>{},icon:'🏦',disabled:true}),
          h(DropZone,{label:'Negocios Ptes de Facturar',hint:'Negocios_ptes_de_facturar.xlsx',file:files.negocios,onFile:f=>setFiles(p=>({...p,negocios:f})),icon:'📦'}),
          h(DropZone,{label:'Contratos Canje / FyO / Acopio',hint:'Reporte_Pos_Contratos.xlsx',file:files.canjes,onFile:()=>{},icon:'🌾',disabled:true}),
        ),
        h('div',{className:'process-row'},
          error&&h('div',{className:'error-msg'},error),
          h('button',{className:'btn btn-primary',style:{padding:'14px 36px',fontSize:'1rem',borderRadius:'10px'},onClick:handleProcess,disabled:!files.negocios||loading},
            loading?'Procesando…':!files.negocios?'Cargá el Excel de Negocios ptes de facturar':'▶  Generar tablero'
          )
        )
      ),

      rows&&h('section',{className:'results-section'},
        h('div',{className:'summary-strip'},
          h(SummaryCard,{label:'Pedidos',value:pedidos.reduce((s,r)=>s+r.importe,0),sub:pedidos.length+' registros',accent:'blue'}),
          h(SummaryCard,{label:'Remitos',value:remitos.reduce((s,r)=>s+r.importe,0),sub:remitos.length+' registros',accent:'purple'}),
          h(SummaryCard,{label:'TOTAL PTE. DE FACTURAR',value:rows.reduce((s,r)=>s+r.importe,0),sub:rows.length+' registros en total',accent:'navy'}),
        ),
        h('div',{className:'tabs',style:{marginBottom:'14px'}},
          h('button',{className:'tab'+(tab==='pedidos'?' active':''),onClick:()=>setTab('pedidos')},'📄 Pedidos',h('span',{className:'tab-badge'},pedidos.length)),
          h('button',{className:'tab'+(tab==='remitos'?' active':''),onClick:()=>setTab('remitos')},'🚚 Remitos',h('span',{className:'tab-badge'},remitos.length)),
          otros.length>0&&h('button',{className:'tab'+(tab==='otros'?' active':''),onClick:()=>setTab('otros')},'⚠ Sin clasificar',h('span',{className:'tab-badge'},otros.length)),
        ),
        h(NegociosTable,{rows:current,tipo:tab}),
        h('div',{className:'legend-bar'},
          h('span',{className:'leg'},'IVA aplicado: Fertilizante 10,5% · Agroquímico / Otros 21% · Importe ya incluye IVA'),
          h('span',{className:'leg'},'Pedidos = códigos PED, PEDA, PDD, PEDTER, PEDCYO · Remitos = REM, REMM, REMTER, REMCYO, REMMTE'),
          h('span',{className:'leg'},'Clic en el ▾ de Cliente o Código para filtrar por valores puntuales · Clic en el nombre de columna para ordenar'),
        )
      ),
    ),
    h('footer',{className:'app-footer'},'📍 Tablero de Pedidos y Remitos · Procesamiento 100% local en tu navegador'),
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
